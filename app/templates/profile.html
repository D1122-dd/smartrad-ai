<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | SmartRAD AI</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='image/Logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Translation Engine (i18n) -->
    <script src="{{ url_for('static', filename='js/translation.js') }}"></script>
    <style>
        body { align-items: flex-start; padding: 2rem; }
        .lang-toggle-btn {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: var(--card-bg, #ffffff);
            color: var(--text-color, #333333);
            border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .lang-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            background-color: var(--primary-hover-light, #f8f9fa);
        }
        .profile-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            margin: 4rem auto 2rem auto;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.75rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 8px 15px rgba(37,99,235,0.25);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 3px solid white;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .avatar:hover::after {
            content: 'Change';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 0.6rem;
            padding: 2px 0;
            text-align: center;
            text-transform: uppercase;
        }
        .profile-name-group h2 { font-size: 1.375rem; font-weight: 700; margin-bottom: 0.25rem; }
        .profile-name-group span { font-size: 0.875rem; color: var(--text-muted); }
        .info-row {
            display: flex; align-items: center; gap: 1rem;
            padding: 0.875rem 0; border-bottom: 1px solid #f1f5f9;
        }
        .info-row:last-of-type { border-bottom: none; }
        .info-icon {
            width: 40px; height: 40px; border-radius: 0.625rem;
            background: #eff6ff; display: flex; align-items: center;
            justify-content: center; color: var(--primary-color); flex-shrink: 0;
        }
        .info-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.125rem; }
        .info-value { font-size: 0.9375rem; font-weight: 500; }
        .action-buttons { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1.75rem; }
        .btn-dashboard {
            padding: 0.75rem; background: #0f172a; color: white;
            border: none; border-radius: 0.75rem; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; text-align: center;
            text-decoration: none; display: block;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .btn-dashboard:hover { background: #1e293b; transform: translateY(-1px); }
        .btn-logout {
            padding: 0.75rem; background: white; color: var(--error-color);
            border: 1px solid #fee2e2; border-radius: 0.75rem; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-logout:hover { background: #fef2f2; }
    </style>
</head>
<body>
    <!-- Floating Language Switcher -->
    <div class="lang-switch-container" style="position: absolute; top: 20px; right: 20px; z-index: 1000;">
        <button onclick="toggleLanguage()" class="lang-toggle-btn" id="langToggle">
            <i class="fas fa-globe" style="margin-inline-end: 6px;"></i>
            <span id="langText">English</span>
        </button>
    </div>

    <div class="profile-card">
        <div class="profile-header">
            <div class="avatar" id="avatarEl" onclick="document.getElementById('avatarInput').click()">
                <img id="avatarImg" src="" alt="Avatar">
                <span id="avatarInitials">?</span>
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">
            <div class="profile-name-group">
                <h2 id="profileName">Loading...</h2>
                <span id="profileEmail">—</span>
            </div>
        </div>
        <div class="info-row">
            <div class="info-icon"><i class="fas fa-user"></i></div>
            <div>
                <div class="info-label" data-i18n="modal_patient.name">Full Name</div>
                <div class="info-value" id="infoName">—</div>
            </div>
        </div>
        <div class="info-row">
            <div class="info-icon"><i class="fas fa-envelope"></i></div>
            <div>
                <div class="info-label" data-i18n="login.email_label">Email Address</div>
                <div class="info-value" id="infoEmail">—</div>
            </div>
        </div>
        <div class="info-row">
            <div class="info-icon"><i class="fas fa-phone"></i></div>
            <div>
                <div class="info-label" data-i18n="register.phone_label">Phone Number</div>
                <div class="info-value" id="infoPhone">Not provided</div>
            </div>
        </div>
        <div class="action-buttons">
            <a href="/dashboard" class="btn-dashboard"><i class="fas fa-arrow-left"></i> <span data-i18n="forgot_pass.back_dashboard">Return to Dashboard</span></a>
            <button class="btn-logout" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> <span data-i18n="common.logout">Sign Out</span></button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        (async () => {
            const ok = await Auth.guard();
            if (!ok) return;
            try {
                const res = await Auth.fetch('/api/users/profile');
                const result = await res.json();
                if (result.success) {
                    const d = result.data;
                    const initials = d.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
                    
                    document.getElementById('avatarInitials').textContent = initials;
                    if (d.profile_image) {
                        const img = document.getElementById('avatarImg');
                        img.src = d.profile_image;
                        img.style.display = 'block';
                        document.getElementById('avatarInitials').style.display = 'none';
                    }

                    document.getElementById('profileName').textContent = d.name;
                    document.getElementById('profileEmail').textContent = d.email;
                    document.getElementById('infoName').textContent = d.name;
                    document.getElementById('infoEmail').textContent = d.email;
                    document.getElementById('infoPhone').textContent = d.phone_number || 'Not provided';
                } else { Auth.logout(); }
            } catch (e) { console.error('Failed to load profile', e); }
        })();

        async function handleAvatarUpload(input) {
            if (!input.files || !input.files[0]) return;
            
            const formData = new FormData();
            formData.append('image', input.files[0]);
            
            try {
                const res = await Auth.fetch('/api/users/upload-avatar', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();
                if (result.success) {
                    const img = document.getElementById('avatarImg');
                    img.src = result.image_url;
                    img.style.display = 'block';
                    document.getElementById('avatarInitials').style.display = 'none';
                }
            } catch (e) {
                console.error('Upload failed', e);
            }
        }
    </script>
</body>
</html>
