<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan History | SmartRAD AI</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='image/Logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/performance.css') }}">
    
    <!-- Translation Engine (i18n) -->
    <script src="{{ url_for('static', filename='js/translation.js') }}"></script>
</head>
<body class="dash-body">
<div id="toast-container"></div>

<div class="dash-layout">
    <!-- ── Sidebar ───────────────────────────────────── -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="{{ url_for('static', filename='image/Logo.png') }}" class="sidebar-logo-img" alt="Logo">
            <div>
                <div class="sidebar-brand" data-i18n="common.brand_name">SmartRAD</div>
                <div class="sidebar-sub" data-i18n="common.brand_sub">AI Workflow</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-label" data-i18n="common.main_menu">MAIN</div>
            <a href="/dashboard" class="nav-link"><i class="fas fa-th-large"></i> <span data-i18n="common.dashboard">Dashboard</span></a>
            <a href="/queue"     class="nav-link"><i class="fas fa-list-ol"></i>  <span data-i18n="common.case_queue">Case Queue</span></a>
            <a href="/performance" class="nav-link active"><i class="fas fa-chart-line"></i> <span data-i18n="common.performance">Performance</span></a>
            <div class="nav-section-label" data-i18n="common.account_menu">ACCOUNT</div>
            <a href="/settings"   class="nav-link"><i class="fas fa-cog"></i> <span data-i18n="common.settings">Settings</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-chip">
                <a href="/profile" class="user-chip-link" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit; flex-grow: 1; transition: opacity 0.2s;">
                    <div class="mini-avatar" id="sidebarAvatar">
                        <img id="sidebarImg" src="" alt="" style="width:100%; height:100%; border-radius:50%; object-fit:cover; display:none;">
                        <span id="sidebarInitials">?</span>
                    </div>
                    <div class="user-chip-info">
                        <div class="user-chip-name" id="sidebarName">Loading…</div>
                        <div class="user-chip-role">Radiologist</div>
                    </div>
                </a>
                <button class="logout-icon-btn" onclick="Auth.logout()" title="Sign out">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- ── Main ─────────────────────────────────────────────────── -->
    <main class="dash-main">
        <header class="dash-topbar">
            <div>
                <h1 class="dash-title" data-i18n="history.title">Scan History Log</h1>
                <p class="dash-subtitle" data-i18n="history.subtitle">Detailed record of all completed scans.</p>
            </div>
            <div class="topbar-actions" style="display: flex; align-items: center; gap: 1rem;">
                <!-- Language Toggle Button -->
                <button class="topbar-icon-btn" id="langToggle" title="Toggle Language" onclick="toggleLanguage()">
                    <i class="fas fa-globe"></i>
                </button>
                <a href="/performance" class="topbar-btn">
                    <i class="fas fa-arrow-left"></i> <span data-i18n="history.back_perf">Back to Performance</span>
                </a>
                <button class="topbar-btn" style="background:#ef4444;" onclick="clearAllHistory()">
                    <i class="fas fa-trash-sweep"></i> <span data-i18n="history.btn_clear">Clear All History</span>
                </button>
            </div>
        </header>

        <!-- History Table -->
        <section class="section-block">
            <div class="table-wrap">
                <table class="queue-table">
                    <thead>
                        <tr>
                            <th data-i18n="queue.col_patient">Patient</th>
                            <th data-i18n="queue.col_exam">Exam Type</th>
                            <th data-i18n="queue.col_modality">Modality</th>
                            <th data-i18n="history.col_room">Room</th>
                            <th>Duration</th>
                            <th data-i18n="history.col_urgent">Urgent</th>
                            <th data-i18n="history.col_completed">Completed At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="10" class="queue-empty">
                            <i class="fas fa-spinner fa-spin"></i> Loading…
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
<script>
    (async () => {
        const ok = await Auth.guard();
        if (!ok) return;
        const name = Auth.getUserName();
        const image = Auth.getProfileImage();

        document.getElementById('sidebarName').textContent = name;
        const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        document.getElementById('sidebarInitials').textContent = initials;

        if (image) {
            const img = document.getElementById('sidebarImg');
            img.src = image;
            img.style.display = 'block';
            document.getElementById('sidebarInitials').style.display = 'none';
        }
    })();
</script>
</body>
</html>
