<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SmartRAD AI</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='image/Logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Translation Engine (i18n) -->
    <script src="{{ url_for('static', filename='js/translation.js') }}"></script>
    <style>
        .lang-toggle-btn {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 20px;
            background-color: var(--card-bg, #ffffff);
            color: var(--text-color, #333333);
            border: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .lang-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            background-color: var(--primary-hover-light, #f8f9fa);
        }
        .rtl .auth-left {
            order: 2;
        }
        .rtl .auth-right {
            order: 1;
        }
        .rtl .form-group input {
            text-align: right;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            text-decoration: none;
            margin-bottom: 1.5rem;
            transition: all 0.3s;
            font-weight: 500;
        }
        .back-link:hover { color: var(--primary-color); transform: translateX(-4px); }
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .step {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .step.active { 
            background: var(--primary-color); 
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>
    <!-- Floating Language Switcher -->
    <div class="lang-switch-container" style="position: absolute; top: 20px; right: 20px; z-index: 1000;">
        <button onclick="toggleLanguage()" class="lang-toggle-btn" id="langToggle">
            <i class="fas fa-globe" style="margin-inline-end: 6px;"></i>
            <span id="langText">English</span>
        </button>
    </div>

    <div class="auth-wrapper">
        <!-- Left Side: Welcome Panel -->
        <div class="auth-left">
            <div class="auth-left-content">
                <h1 data-i18n="forgot_pass.title">Forgot Password?</h1>
                <p data-i18n="forgot_pass.subtitle">No worries! Follow the steps to securely reset your account access.</p>
            </div>
        </div>

        <!-- Right Side: Reset Form -->
        <div class="auth-right">
            <div class="auth-form-container">
                <a href="/login" class="back-link">
                    <i class="fas fa-arrow-left"></i> <span data-i18n="forgot_pass.back_login">Back to Login</span>
                </a>

                <div class="auth-logo-section">
                    <img src="{{ url_for('static', filename='image/Logo.png') }}" class="auth-logo-img" alt="SmartRAD Logo">
                    <div class="auth-brand-name"><span data-i18n="common.brand_name">SmartRAD</span> <span>AI</span></div>
                </div>

                <div class="step-indicator">
                    <div class="step active" id="step1dot"></div>
                    <div class="step" id="step2dot"></div>
                    <div class="step" id="step3dot"></div>
                </div>

                <div id="alert" class="alert"></div>

                <!-- Step 1: Email Verification -->
                <form id="emailForm">
                    <div class="form-group">
                        <label for="email" data-i18n="login.email_label">Email Address</label>
                        <input type="email" id="email" name="email" data-i18n-placeholder="login.email_placeholder" placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="auth-btn" id="verifyBtn">
                        <span id="verifySpinner" class="spinner"></span>
                        <span id="verifyText" data-i18n="forgot_pass.btn_send">Send Verification Code</span>
                    </button>
                </form>

                <!-- Step 2: OTP Verification -->
                <form id="otpForm" style="display:none;">
                    <div class="form-group text-center">
                        <p class="mb-2" style="margin-bottom: 1rem; color: var(--text-dark); font-weight: 500;" data-i18n="forgot_pass.enter_code">Enter the 6-digit code sent to your email</p>
                        <div class="otp-container" style="display:flex; justify-content:center; gap:0.5rem; margin-top:1rem;">
                            <input type="text" id="otp" name="otp" maxlength="6" 
                                   style="width: 180px; text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem; font-weight: bold;" 
                                   placeholder="000000" required>
                        </div>
                    </div>
                    <button type="submit" class="auth-btn" id="otpBtn" style="margin-top: 1rem;">
                        <span id="otpSpinner" class="spinner"></span>
                        <span id="otpText" data-i18n="forgot_pass.btn_verify">Verify Code</span>
                    </button>
                    <div class="text-center mt-3" style="text-align: center; margin-top: 1rem;">
                        <a href="#" onclick="location.reload();" style="font-size: 0.9rem; color: var(--primary-blue); font-weight: 600; text-decoration: none;" data-i18n="forgot_pass.change_email">Change Email</a>
                    </div>
                </form>

                <!-- Step 3: New Password -->
                <form id="resetForm" style="display:none;">
                    <input type="hidden" id="verifiedEmail">
                    <div class="form-group">
                        <label for="new_password" data-i18n="forgot_pass.new_password">New Password</label>
                        <input type="password" id="new_password" name="new_password" data-i18n-placeholder="forgot_pass.enter_new_pass" placeholder="Enter new password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password" data-i18n="settings.confirm_pass">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" data-i18n-placeholder="forgot_pass.confirm_new_pass" placeholder="Confirm new password" required minlength="6">
                    </div>
                    <button type="submit" class="auth-btn" id="resetBtn">
                        <span id="resetSpinner" class="spinner"></span>
                        <span id="resetText" data-i18n="settings.btn_update">Reset Password</span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p><span data-i18n="forgot_pass.remember_text">Remember your password?</span> <a href="/login" data-i18n="common.sign_in">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        // --- Step 1: Send OTP ---
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert');
            alertBox.style.display = 'none';
            const btn = document.getElementById('verifyBtn');
            const spinner = document.getElementById('verifySpinner');
            const btnText = document.getElementById('verifyText');

            spinner.style.display = 'inline-block';
            btnText.textContent = 'Sending...';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const result = await res.json();

                if (result.success) {
                    // Show OTP step
                    document.getElementById('verifiedEmail').value = email;
                    document.getElementById('emailForm').style.display = 'none';
                    document.getElementById('otpForm').style.display = 'block';
                    document.getElementById('step2dot').classList.add('active');
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = result.message;
                    alertBox.style.display = 'block';
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.textContent = result.message || 'Email not found';
                    alertBox.style.display = 'block';
                    spinner.style.display = 'none';
                    btnText.textContent = t('forgot_pass.btn_send');
                    btn.disabled = false;
                }
            } catch (err) {
                alertBox.className = 'alert alert-error';
                alertBox.textContent = t('common.error');
                alertBox.style.display = 'block';
                spinner.style.display = 'none';
                btnText.textContent = t('forgot_pass.btn_send');
                btn.disabled = false;
            }
        });

        // --- Step 2: Verify OTP ---
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert');
            alertBox.style.display = 'none';
            const btn = document.getElementById('otpBtn');
            const spinner = document.getElementById('otpSpinner');
            const btnText = document.getElementById('otpText');

            spinner.style.display = 'inline-block';
            btnText.textContent = 'Verifying...';
            btn.disabled = true;

            const email = document.getElementById('verifiedEmail').value;
            const otp = document.getElementById('otp').value.trim();

            try {
                const res = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                const result = await res.json();

                if (result.success) {
                    // Show Reset Password step
                    document.getElementById('otpForm').style.display = 'none';
                    document.getElementById('resetForm').style.display = 'block';
                    document.getElementById('step3dot').classList.add('active');
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = result.message;
                    alertBox.style.display = 'block';
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.textContent = result.message || 'Invalid code';
                    alertBox.style.display = 'block';
                    spinner.style.display = 'none';
                    btnText.textContent = t('forgot_pass.btn_verify');
                    btn.disabled = false;
                }
            } catch (err) {
                alertBox.className = 'alert alert-error';
                alertBox.textContent = t('common.error');
                alertBox.style.display = 'block';
                spinner.style.display = 'none';
                btnText.textContent = t('forgot_pass.btn_verify');
                btn.disabled = false;
            }
        });

        // --- Step 3: Reset Password ---
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alert');
            alertBox.style.display = 'none';
            const btn = document.getElementById('resetBtn');
            const spinner = document.getElementById('resetSpinner');
            const btnText = document.getElementById('resetText');

            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const email = document.getElementById('verifiedEmail').value;

            if (newPassword !== confirmPassword) {
                alertBox.className = 'alert alert-error';
                alertBox.textContent = t('settings.toast_pass_match');
                alertBox.style.display = 'block';
                return;
            }

            spinner.style.display = 'inline-block';
            btnText.textContent = 'Resetting...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, new_password: newPassword })
                });
                const result = await res.json();

                if (result.success) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Password reset successfully! Redirecting to login...';
                    alertBox.style.display = 'block';
                    setTimeout(() => { window.location.href = '/login'; }, 1500);
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.textContent = result.message || 'Reset failed. Try again.';
                    alertBox.style.display = 'block';
                    spinner.style.display = 'none';
                    btnText.textContent = t('settings.btn_update');
                    btn.disabled = false;
                }
            } catch (err) {
                alertBox.className = 'alert alert-error';
                alertBox.textContent = t('common.error');
                alertBox.style.display = 'block';
                spinner.style.display = 'none';
                btnText.textContent = t('settings.btn_update');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
